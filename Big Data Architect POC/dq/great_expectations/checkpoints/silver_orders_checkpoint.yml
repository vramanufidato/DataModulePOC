name: silver_orders_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "silver-orders-%Y%m%d-%H%M%S"
validations:
  - batch_request:
      datasource_name: gcp_bigquery
      data_connector_name: default_runtime_data_connector_name
      data_asset_name: clean_orders
      runtime_parameters:
        query: "SELECT * FROM `poc.silver.clean_orders` WHERE DATE(ingested_at) = CURRENT_DATE()"
      batch_identifiers:
        default_identifier_name: silver_orders_today
    expectation_suite_name: silver_orders_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction
      - name: notify_on_failure
        action:
          class_name: MicrosoftTeamsNotificationAction
          notify_on: failure
          teams_webhook: ${TEAMS_WEBHOOK_URL}
evaluation_parameters: {}
runtime_configuration: {}
notify_with: []
