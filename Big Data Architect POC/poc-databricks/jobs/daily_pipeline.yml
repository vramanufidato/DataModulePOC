resources:
  jobs:
    daily_medallion_job:
      name: daily-medallion-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${var.alert_email}
        on_duration_warning_threshold_exceeded:
          - ${var.alert_email}
      timeout_seconds: 7200
      max_concurrent_runs: 1
      tags:
        environment: ${bundle.target}
        pipeline: medallion
      tasks:
        - task_key: run_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.poc_medallion_dlt.id}
            full_refresh: false
        - task_key: dq_validation
          depends_on:
            - task_key: run_dlt
          sql_task:
            warehouse_id: ${resources.sql_warehouses.prod_warehouse.id}
            file:
              path: ../sql/dq_validation.sql
        - task_key: gold_aggregation
          depends_on:
            - task_key: dq_validation
          sql_task:
            warehouse_id: ${resources.sql_warehouses.prod_warehouse.id}
            file:
              path: ../sql/gold_daily_revenue.sql
        - task_key: refresh_dashboard
          depends_on:
            - task_key: gold_aggregation
          notebook_task:
            notebook_path: ../notebooks/refresh_dashboard.py
      permissions:
        - group_name: data-engineers
          level: CAN_MANAGE
        - group_name: data-analysts
          level: CAN_VIEW
