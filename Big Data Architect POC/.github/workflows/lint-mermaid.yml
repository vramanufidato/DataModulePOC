name: lint-mermaid
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g @mermaid-js/mermaid-cli
      - run: bash scripts/render-mermaid.sh --validate-only
